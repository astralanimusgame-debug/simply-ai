name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|e: |What went wrong|Could not|FAILURE|> " build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SimplyAI-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SimplyAI-demo-apk
          path: SimplyAI-demo.apk
      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo -y --cleanup-tag || true
          gh release create demo SimplyAI-demo.apk \
            --title "Simply AI — демо (сборка ${{ github.run_number }})" \
            --notes "Скачайте SimplyAI-demo.apk на телефон и откройте его. Android попросит разрешить установку из этого источника." \
            --target "${{ github.sha }}" --latest
