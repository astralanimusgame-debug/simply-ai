plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simplyai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.simplyai.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.3-demo"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
