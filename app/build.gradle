plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simplyai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.simplyai.app"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "0.4-demo"
        // Web client ID from Google Cloud (OAuth client, type "Web application"). Set it in gradle.properties.
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${project.findProperty('GOOGLE_WEB_CLIENT_ID') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    // One fixed key for demo builds, so each new APK installs over the previous one.
    // Demo only: for Google Play use a separate private upload key that is never committed.
    signingConfigs {
        demo {
            storeFile file('simplyai-demo.keystore')
            storePassword 'simplyai-demo'
            keyAlias 'simplyai'
            keyPassword 'simplyai-demo'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.demo
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
