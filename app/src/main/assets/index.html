<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>Simply AI — учимся с Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, funny, reassuring — for adults who have never used AI (design from Google Stitch)
   IDEA: a friendly lesson book on the phone; Grandma comments on every screen
   PICTURE: Grandma avatar, game scene, live site preview, chat-window diagram, quiz cards
   COLOUR and TYPE: cobalt #2340E8, sun yellow #FFC83D, coral #FF6A4D, ink #17142B on white; Nunito (rounded, has Cyrillic) titles, Plus Jakarta Sans body
   LAYOUT: one 480px column, 20px margins, 16px gaps, bordered soft cards, bottom navigation */
:root{color-scheme:light;--bg:#FFFFFF;--ink:#17142B;--var:#4A4766;--out:#777494;--outv:#D5D7E8;--slow:#F7F8FC;--s:#F0F2FA;--shigh:#E6E9F5;
--cob:#2340E8;--pc:#EEF1FF;--onpc:#0B1E8A;--sun:#FFC83D;--tc:#FFF8E1;--ontc:#4A3500;--coral:#FF6A4D;--sc:#FFF0ED;--onsc:#5C1406;
--ok:#16803C;--okc:#DCFCE7;--onokc:#14532D;--err:#BA1A1A;--errc:#FFDAD6;--onerrc:#7A0909;
--hf:'Nunito','Fredoka',system-ui,sans-serif;--bf:'Plus Jakarta Sans','Nunito Sans',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--bf);overflow-x:clip;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:96px}
.pg{padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px}
h1{font:800 28px/34px var(--hf);letter-spacing:-.25px;margin:0;text-wrap:balance}
h2{font:800 22px/28px var(--hf);margin:0;text-wrap:balance}
h3{font:700 17px/24px var(--bf);margin:0}
p{margin:0}
.sub{color:var(--var);font-size:16px;line-height:24px}
.lbl{font:600 14px/20px var(--bf);color:var(--var)}
.lblc{font:700 13px/18px var(--bf);color:var(--cob)}
svg.i{width:20px;height:20px;flex:none}
.btn{min-height:52px;border-radius:16px;border:0;background:var(--cob);color:#fff;font:700 16px/22px var(--bf);padding:12px 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;text-align:center}
.btn.wide{width:100%}.btn.sm{min-height:48px;font-size:15px;padding:10px 16px}
.btn.out{background:var(--bg);color:var(--cob);border:2px solid var(--outv)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.ink{background:var(--ink);color:#fff}
.btn.white{background:#fff;color:var(--ink)}
.btn.tonal{background:var(--pc);color:var(--cob)}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--cob);font:700 15px var(--bf);cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0}
.link.red{color:var(--err);align-self:center}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;border:1px solid var(--outv);border-radius:999px;padding:0 16px;background:var(--slow);color:var(--ink);font:700 15px var(--bf);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--cob);border-color:var(--cob);color:#fff}
.card{background:var(--slow);border:1px solid var(--outv);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.task{background:var(--bg);border:2px solid var(--outv);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:8px}
.nina{background:var(--slow);border:1px solid var(--outv);border-radius:24px;padding:14px;display:flex;gap:12px;align-items:center}
.nina .t{display:flex;flex-direction:column;gap:2px;font-size:16px;line-height:24px}
.ava{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--sun);background:var(--tc);display:grid;place-items:center;overflow:hidden}
.ava svg{width:44px;height:44px}
.msg{background:var(--slow);border:1px solid var(--outv);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg p{font-size:16px;line-height:24px;overflow-wrap:anywhere;white-space:pre-line}
.bar{height:8px;border-radius:999px;background:var(--s);overflow:hidden}.bar i{display:block;height:100%;background:var(--cob);border-radius:999px;transition:width .4s}
.cnt{font:700 14px var(--bf);color:var(--cob);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font:700 14px/20px var(--bf);white-space:nowrap}
.pill.y{background:var(--tc);border:1px solid var(--sun);color:var(--ink)}
.pill.b{background:var(--pc);color:var(--cob)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 20px}
.brand{display:flex;align-items:center;gap:10px;font:800 19px var(--hf);margin-inline-end:auto}
.logo{width:36px;height:36px;border-radius:50%;background:var(--cob);display:grid;place-items:center;flex:none}
.ltop{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 20px 10px;border-bottom:1px solid var(--outv);display:flex;flex-direction:column;gap:10px}
.ltop .r{display:flex;align-items:center;gap:10px;justify-content:space-between}
.round{flex:none;width:44px;height:44px;border-radius:50%;background:var(--s);border:0;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.pillbtn{flex:none;min-height:40px;border:1px solid var(--outv);background:var(--bg);color:var(--cob);border-radius:999px;padding:0 14px;font:700 14px var(--bf);cursor:pointer}
.dots{display:flex;gap:6px;align-items:center}.dots i{width:10px;height:10px;border-radius:999px;background:var(--outv)}.dots i.on{width:28px;background:var(--cob)}
.hero{background:var(--cob);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero h1{color:#fff}
.hero .bub{display:flex;gap:12px;align-items:flex-start}
.hero .bb{display:flex;flex-direction:column;gap:8px;flex:1}
.hero .bb span{background:#fff;color:var(--ink);border-radius:16px 16px 16px 4px;padding:8px 12px;font:700 14px/20px var(--bf);align-self:flex-start}
.hero .bb span.y{background:var(--sun);border-radius:16px 16px 4px 16px;align-self:flex-end}
.hero .prog{display:flex;align-items:center;gap:12px;font:700 14px var(--bf)}
.hero .prog .bar{flex:1;background:#1A2FB0}.hero .prog .bar i{background:var(--sun)}
.forU{background:var(--coral);color:var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.forU .tag{align-self:flex-start;background:#fff;border-radius:999px;padding:4px 12px;font:700 14px var(--bf)}
.li{display:flex;gap:14px;align-items:center;width:100%;text-align:start;background:var(--bg);border:1px solid var(--outv);border-radius:20px;padding:14px;min-height:72px;cursor:pointer;color:var(--ink);font:inherit}
.li .num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--s);color:var(--ink);display:grid;place-items:center;font:800 18px var(--hf)}
.li .tx{flex:1;display:flex;flex-direction:column}.li .tx b{font:700 17px/24px var(--bf)}.li .tx small{font:600 14px var(--bf);color:var(--var)}
.li .ch{color:var(--out)}
.li.done{background:var(--tc);border-color:var(--sun)}.li.done .num{background:var(--sun)}
.li.cur{background:var(--pc);border:2px solid var(--cob)}.li.cur .num{background:var(--cob);color:#fff}.li.cur small{color:var(--cob)}.li.cur .ch{color:var(--cob)}
.illu{border-radius:24px;overflow:hidden;line-height:0;border:1px solid var(--outv)}.illu svg{width:100%;height:auto;display:block}
.chatInfo{background:var(--pc);border:1px solid #C9D1FF;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chatInfo .two{display:flex;align-items:stretch;gap:12px}
.chatInfo .cw{flex:1;background:#fff;border:1px solid var(--outv);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.chatInfo .cw b{color:var(--cob);font:700 15px var(--bf)}.chatInfo .cw span{font:600 13px var(--bf);color:var(--var)}
.chatInfo .wall{width:6px;border-radius:3px;background:var(--coral);flex:none}
.win{background:var(--sun);color:var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.win .h{display:flex;align-items:center;gap:8px;font:800 20px var(--hf)}
.win .in{background:var(--tc);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.win .in p{font-size:16px;line-height:24px}
.win ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.kind{align-self:flex-start;border-radius:999px;padding:3px 10px;font:700 13px var(--bf);background:var(--bg);color:var(--ink)}
.kind.same{background:var(--cob);color:#fff}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--pc);border-radius:20px;padding:14px;font-size:16px;line-height:24px}
.q{border:2px solid var(--outv);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.q.ok{border-color:var(--ok)}.q.bad{border-color:var(--err)}
.q b{font:800 18px/25px var(--hf)}
.ab{display:flex;gap:8px}
.ab button{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--outv);background:var(--slow);color:var(--ink);font:700 15px var(--bf);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.ab button.g{background:var(--ok);border-color:var(--ok);color:#fff}.ab button.r{background:var(--err);border-color:var(--err);color:#fff}
.fb{border-radius:14px;padding:12px;font-size:15px;line-height:22px}.fb.ok{background:var(--okc);color:var(--onokc)}.fb.bad{background:var(--errc);color:var(--onerrc)}
.meter{background:var(--sc);border:1px solid var(--coral);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.meter .bar{background:#fff}.meter .bar i{background:var(--coral)}
.chat{background:var(--tc);border:1px solid var(--sun);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.me{align-self:flex-end;max-width:85%;background:var(--cob);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 12px;font-size:15px;line-height:21px}
.ai{max-width:94%;background:#fff;border:1px solid var(--outv);border-radius:16px 16px 16px 4px;padding:12px;font-size:15px;line-height:22px;white-space:pre-line}
.chk{display:flex;gap:12px;align-items:center;text-align:start;border:1px solid var(--outv);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px;min-height:56px;font:600 15px/21px var(--bf);cursor:pointer;width:100%}
.chk[aria-pressed=true]{border:2px solid var(--cob);background:var(--pc)}
.chk .bx{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--cob);display:grid;place-items:center;color:#fff}
.chk[aria-pressed=true] .bx{background:var(--cob)}
.steps{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--var)}
label{display:block;font:600 14px var(--bf);color:var(--var);margin-bottom:6px}
input{width:100%;min-height:52px;border:1px solid var(--outv);border-radius:14px;padding:10px 14px;font:16px var(--bf);color:var(--ink);background:var(--bg)}
input:focus{outline:2px solid var(--cob);border-color:var(--cob)}
.site{background:var(--sc);border:1px solid var(--coral);border-radius:24px;padding:16px 18px 0}
.site .w{background:#fff;border-radius:16px 16px 0 0;overflow:hidden;border:1px solid var(--outv);border-bottom:0}
.site .bz{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--ink);color:#C9C6D6;font-size:11px}
.site .bz i{width:9px;height:9px;border-radius:50%;background:var(--coral)}.site .bz i+i{background:var(--sun)}.site .bz i+i+i{background:#fff;margin-inline-end:6px}
.site .hd{padding:16px;color:#fff}.site .hd b{display:block;font:800 19px/1.2 var(--hf);overflow-wrap:anywhere}.site .hd span{font-size:13px;opacity:.9}
.site .bd{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.site .pl{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:3px 10px;font:700 12px var(--bf)}
.site .call{align-self:flex-start;background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;font:700 13px var(--bf);overflow-wrap:anywhere}
.tiles{background:var(--cob);color:#fff;border-radius:24px;padding:16px}
.tiles .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tiles .g div{background:#3552FF;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;font:700 13px/1.25 var(--bf)}
.navb{display:flex;gap:10px}.navb .btn{flex:1}.navb .btn.out{flex:none}
.got{color:#D9A400}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--slow);border:1px solid var(--outv);border-radius:16px;padding:12px 6px;text-align:center}
.stats b{display:block;font:800 19px var(--hf);color:var(--cob);white-space:nowrap}.stats span{font:600 13px var(--bf);color:var(--var)}
.seg{display:flex;background:var(--s);border:1px solid var(--outv);border-radius:999px;padding:4px}
.seg button{flex:1;min-height:48px;border:0;border-radius:999px;background:transparent;color:var(--var);font:700 16px var(--bf);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--cob);color:#fff}
.mod{border:1px solid var(--outv);border-radius:20px;overflow:hidden;background:var(--bg)}
.mod.on{border:2px solid var(--cob)}
.mod>button{width:100%;display:flex;gap:12px;align-items:center;text-align:start;background:transparent;border:0;padding:14px;min-height:72px;cursor:pointer;font:inherit;color:var(--ink)}
.mod .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--s);color:var(--var);display:grid;place-items:center}
.mod .tx{flex:1;display:flex;flex-direction:column}.mod .tx b{font:700 17px/24px var(--bf)}.mod .tx small{font:600 14px var(--bf);color:var(--var)}
.mod ul{margin:0;padding:12px 16px 14px 36px;background:var(--slow);border-top:1px solid var(--outv);display:flex;flex-direction:column;gap:6px;font-size:15px}
.mod .st{font:600 14px var(--bf);color:var(--var);padding:0 16px 14px;background:var(--slow)}
.intro{background:var(--pc);border:2px solid var(--cob);border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:start;font:inherit;color:var(--ink)}
.intro .tx{flex:1;display:flex;flex-direction:column;gap:2px}.intro .tx b{font:700 17px/24px var(--bf)}.intro .tx small{font:600 14px var(--bf);color:var(--var)}
.intro .tag{font:700 12px var(--bf);color:var(--cob);text-transform:uppercase;letter-spacing:.3px}
.cert{background:var(--sun);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px}
.cert .nm{font:800 24px/1.15 var(--hf);overflow-wrap:anywhere}
.cert.lock{background:var(--tc);border:1px dashed var(--sun)}
.price{font:800 22px var(--hf);white-space:nowrap}
.ucard{display:flex;gap:14px;align-items:center}
.uava{flex:none;width:64px;height:64px;border-radius:50%;border:2px solid var(--cob);background:var(--pc);color:var(--cob);display:grid;place-items:center;font:800 26px var(--hf)}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ptiles div{border:1px solid var(--outv);border-radius:16px;padding:12px 6px;text-align:center;background:var(--bg)}
.ptiles div:first-child{background:var(--tc);border-color:var(--sun)}
.ptiles b{display:block;font:800 22px var(--hf);color:var(--cob)}.ptiles div:first-child b{color:var(--ink)}
.ptiles span{font:600 13px var(--bf);color:var(--var)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--outv);z-index:6;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.nav div{display:flex;max-width:480px;margin:0 auto;gap:6px}
.nav button{flex:1;min-height:56px;background:none;border:0;border-radius:16px;color:var(--var);font:700 13px var(--bf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.nav button[aria-current=page]{background:var(--pc);color:var(--cob)}
.sheet-bg{position:fixed;inset:0;background:rgba(23,20,43,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.handle{width:40px;height:6px;border-radius:999px;background:var(--outv);margin:0 auto}
.checks{list-style:none;margin:0;padding:14px;background:var(--slow);border:1px solid var(--outv);border-radius:20px;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:10px;align-items:center;color:var(--ink)}.checks svg{color:var(--ok)}
.pricebox{flex:none;background:var(--sun);border-radius:16px;padding:8px 14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:30;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.why{display:flex;gap:12px;align-items:center;background:var(--slow);border:1px solid var(--outv);border-radius:20px;padding:14px;font-size:16px}
.okdot{flex:none;width:36px;height:36px;border-radius:50%;background:var(--okc);color:var(--ok);display:grid;place-items:center}
.g{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--cob);display:grid;place-items:center;font:800 15px var(--bf)}
.langb{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;border:2px solid var(--outv);border-radius:16px;background:var(--bg);color:var(--cob);font:700 17px var(--bf);padding:0 18px;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app"><div id="view"></div></div>
<nav class="nav" id="nav" hidden></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status"></div>
<script>
const C = {
ru: {
  ui: {
    chooseLang: "Выберите язык", langSub: "Можно поменять потом в профиле",

    lesson: (a, b) => `Урок ${a} из ${b}`, min: "мин", mini: "Мини-задание",

    right: (a, b) => `Верно: ${a} из ${b}`, tried: (a, b) => `Попробовано: ${a} из ${b}`,
    accuracy: "Точность просьбы", phrasesLbl: "Волшебные фразы", score: "Счёт", contact: "Связаться",
    preview: "превью вашего сайта", styleLbl: "Какой стиль?",

function act(a, d, e) {
  const i = S.les;
  switch (a) {
    case "lang": if (S.lang) S.tasks[S.lang] = T; S.lang = d.l; T = S.tasks[S.lang] || {}; save(); render(); window.scrollTo(0, 0); break;

    case "sel": { const k = cc().L[i].task, s = ts(i), g = +d.g, o = +d.o; s.sel[g] = (k.meter && s.sel[g] === o) ? null : o; changed(i); rerenderTask(); break; }
    case "fin": ts(i).fin = true; changed(i); rerenderTask(); break;
    case "style": ts(i).st = +d.o; saveT(); rerenderTask(); break;
    case "ans": ts(i).ans[+d.q] = d.v; changed(i); rerenderTask(); break;
    case "tog": { const s = ts(i); s.done[+d.s] = !s.done[+d.s]; changed(i); rerenderTask(); break; }
    case "ph": { const s = ts(i); s.cur = +d.o; s.seen[+d.o] = true; changed(i); rerenderTask(); break; }
    case "redo": delete T[i]; saveT(); rerenderTask(); toast(U().redoDone); break;
    case "copy": copyText(promptOf(i)); break;
    case "copyBonus": copyText(cc().L[i].task.bp); break;
    case "copyAll": copyText(promptOf(i) + "\n\n" + cc().L[i].task.bp); break;
    case "copyJob": copyText(cc().jobs[jobIdx()][1]); break;
    case "tab": S.tab = d.t; save(); render(); break;

    case "reset": S.stars = {}; S.paid = false; S.jobs = {}; S.tasks = {}; S.pos = {}; S.lastLes = null; T = {}; save(); render(); toast(U().resetDone); break;
    case "bg": if (e.target === e.currentTarget) { sheet = null; renderSheet(); } break;

    case "doLogin": {

    }

  }
}
